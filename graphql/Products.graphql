fragment ProductVariant on ProductVariant {
  id
  sku
  name
  media {
    id
    alt
    url
  }
  pricing {
    price {
      gross {
        amount
        currency
      }
    }
  }
  attributes {
    attribute {
      id
      slug
      name
    }
    values {
      name
      slug
      value
      boolean
      plainText
    }
  }
}

fragment Product on Product {
  id
  name
  description
  slug
  category {
    slug
    name
  }
  media {
    url
    alt
  }
  defaultVariant {
    ...ProductVariant
  }
  pricing {
    priceRange {
      start {
        gross {
          amount
        }
      }
    }
  }
  attributes {
    attribute {
      id
      slug
      name
    }
    values {
      name
      slug
      value
      boolean
      plainText
      reference
    }
  }
  variants {
    ...ProductVariant
  }
}

query getProductById($id: ID!, $channel: String!) {
  product(id: $id, channel: $channel) {
    ...Product
  }
}

query getProductsList($channel: String!) {
  products(first: 10, channel: $channel) {
    edges {
      node {
        ...Product
      }
    }
  }
}

query searchProducts(
  $channel: String!
  $search: String!
  $categories: [ID!]
  $collections: [ID!]
) {
  products(
    first: 100
    channel: $channel
    filter: {
      search: $search
      categories: $categories
      collections: $collections
    }
  ) {
    edges {
      node {
        ...Product
      }
    }
  }
}


query getProductBySlug($slug: String!, $channel: String!) {
  product(slug: $slug, channel: $channel) {
    id
    defaultVariant {
      id
    }
  }
}