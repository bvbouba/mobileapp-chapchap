fragment OrderShippingPrice on TaxedMoney {
  currency
  gross {
    currency
    amount
  }
}

fragment OrderShippingMethod on ShippingMethod {
  id
  name
  price {
    amount
  }
}

fragment OrderPrice on TaxedMoney {
  currency
  tax {
    currency
    amount
  }
  net {
    currency
    amount
  }
  gross {
    currency
    amount
  }
}

fragment OrderLineVariant on ProductVariant {
  id
  metadata {
    key
    value
  }
  product {
    id
    name
    slug
    attributes {
      attribute {
        id
        slug
        name
      }

      values {
        name
        slug
        value
        boolean
        reference
        plainText
      }
    }
    media {
      url
    }
  }
  attributes {
    ...SelectedAttribute
  }
  sku
  name
  media {
    url
  }
}

fragment OrderLine on OrderLine {
  id
  quantity
  metadata {
    key
    value
  }
  undiscountedUnitPrice {
    gross {
      amount
    }
  }
  unitDiscount {
    amount
  }
  totalPrice {
    ...OrderPrice
  }
  variant {
    ...OrderLineVariant
  }
}

fragment Order on Order {
  customerNote
  created
  status
  id
  number
  isPaid
  paymentStatusDisplay
  metadata {
    key
    value
  }
  shippingPrice {
    ...OrderShippingPrice
  }
  shippingMethodName
  shippingMethods {
    ...OrderShippingMethod
  }
  total {
    ...OrderPrice
  }
  subtotal {
    ...OrderPrice
  }
  voucher {
    code
    discountValue
    currency
  }
  undiscountedTotal {
    gross {
      currency
      amount
    }
  }
  lines {
    ...OrderLine
  }
}

query getOrderById($id: ID!) {
  order(id: $id) {
    ...Order
  }
}

mutation syncMyOrders {
  syncMyOrders {
    linkedCount
    orderIds
    errors {
      field
      message
      code
    }
  }
}

query myOrders($first: Int = 50) {
  me {
    id
    orders(first: $first) {
      edges {
        node {
          ...Order
        }
      }
    }
  }
}
