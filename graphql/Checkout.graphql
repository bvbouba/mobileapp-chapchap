
mutation createCheckout($channel: String!, $lines: [CheckoutLineInput!]!) {
  checkoutCreate(input: { channel: $channel, lines: $lines }) {
    checkout {
      ...Checkout
    }
    errors {
      field
      code
      message
    }
  }
}

query getCheckoutById($id: ID!) {
  checkout(id: $id) {
    ...Checkout
  }
}

